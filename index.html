<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма заказа пиццы</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <h2>Привет! Я простая форма для заказа пиццы!</h2>
    <form action="">
        <h3>Шаг1</h3>
        
        <div class="form-row">
            <label for="fullname">ФИО:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Введите ваше ФИО">
        </div>

        <div class="form-row">
            <label for="phone">Телефон:</label>
            <input type="tel" id="phone" name="phone" placeholder="Введите телефон">
        </div>

        <div class="form-row">
            <label for="email">Электронная почта:</label>
            <input type="email" id="email" name="email" placeholder="Введите email">
        </div>

        <div class="form-row">
            <label for="address">Адрес:</label>
            <input type="text" id="address" name="address" placeholder="Введите адрес">
        </div>

        <div class="form-row">
            <label for="comment">Комментарий к заказу:</label>
            <textarea name="comment" id="comment" cols="50" rows="4"></textarea>
        </div>

        <div class="wrap">
            <div>
                <h3>Шаг2</h3>
                <label>Выберите пиццу:</label><br><br>
                <label class="radio-label">
                    <input type="radio" name="pizza" value="pepperoni">
                    Пепперони
                </label><br>
                <label class="radio-label">
                    <input type="radio" name="pizza" value="Margaretti">
                    Маргарита
                </label><br>
                <label class="radio-label">
                    <input type="radio" name="pizza" value="Hawaiian">
                    Гавайская
                </label><br>
                <label class="radio-label">
                    <input type="radio" name="pizza" value="4 Cheese">
                    4 Сыра
                </label><br>
            </div>
            <div>
                <h3>Шаг3</h3>
                <label>Выберите компоненты:</label><br><br>
                <label class="checkbox-label">
                    <input type="checkbox" name="component" value="mushroom">
                    Грибы
                </label><br>
                <label class="checkbox-label">
                    <input type="checkbox" name="component" value="bacon">
                    Бекон
                </label><br>
                <label class="checkbox-label">
                    <input type="checkbox" name="component" value="olive">
                    Оливки
                </label><br>
                <label class="checkbox-label">
                    <input type="checkbox" name="component" value="jalapeno">
                    Халапеньо
                </label><br>
            </div>
        </div>
        
        <div class="button-container">
            <button type="reset">Сбросить</button>
            <button type="submit">Отправить</button>
        </div>
    </form>    
</body>
</html>
